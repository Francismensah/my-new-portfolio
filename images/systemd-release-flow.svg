<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Simple systemd release and rollback flow</title>
  <desc id="desc">A deployment copies a versioned release, switches the current link, restarts systemd, and rolls back on failure.</desc>
  <rect width="1200" height="420" rx="24" fill="#101827"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Release and rollback</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="170" width="210" height="95" rx="14" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
    <text x="175" y="208" fill="#f8fafc" font-size="21" font-weight="700">Copy release</text>
    <text x="175" y="238" fill="#bfdbfe" font-size="16">v2026.10.07</text>
    <rect x="350" y="170" width="210" height="95" rx="14" fill="#164e63" stroke="#2dd4bf" stroke-width="2"/>
    <text x="455" y="208" fill="#f8fafc" font-size="21" font-weight="700">Switch current</text>
    <text x="455" y="238" fill="#99f6e4" font-size="16">atomic symlink</text>
    <rect x="630" y="170" width="210" height="95" rx="14" fill="#164e63" stroke="#2dd4bf" stroke-width="2"/>
    <text x="735" y="208" fill="#f8fafc" font-size="21" font-weight="700">Restart</text>
    <text x="735" y="238" fill="#99f6e4" font-size="16">systemctl</text>
    <rect x="910" y="170" width="220" height="95" rx="14" fill="#3f2d16" stroke="#f59e0b" stroke-width="2"/>
    <text x="1020" y="208" fill="#f8fafc" font-size="21" font-weight="700">Health check</text>
    <text x="1020" y="238" fill="#fde68a" font-size="16">pass or rollback</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M290 217h50"/><path d="M570 217h50"/><path d="M850 217h50"/>
  </g>
  <g fill="#cbd5e1"><path d="m330 207 20 10-20 10z"/><path d="m610 207 20 10-20 10z"/><path d="m890 207 20 10-20 10z"/></g>
  <path d="M1020 285v65H455v-75" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="9 9"/>
  <text x="735" y="383" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="18">failed check → point current back to the previous release</text>
</svg>
