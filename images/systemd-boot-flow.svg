<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Simple Linux boot flow</title>
  <desc id="desc">The Linux kernel starts systemd, which starts application services.</desc>
  <rect width="1200" height="420" rx="24" fill="#101827"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Linux boot flow</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="170" width="220" height="100" rx="14" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
    <text x="190" y="212" fill="#f8fafc" font-size="24" font-weight="700">Kernel</text>
    <text x="190" y="245" fill="#bfdbfe" font-size="17">starts userspace</text>
    <rect x="490" y="170" width="220" height="100" rx="14" fill="#164e63" stroke="#2dd4bf" stroke-width="2"/>
    <text x="600" y="212" fill="#f8fafc" font-size="24" font-weight="700">systemd</text>
    <text x="600" y="245" fill="#99f6e4" font-size="17">PID 1</text>
    <rect x="900" y="170" width="220" height="100" rx="14" fill="#3f2d16" stroke="#f59e0b" stroke-width="2"/>
    <text x="1010" y="212" fill="#f8fafc" font-size="24" font-weight="700">Services</text>
    <text x="1010" y="245" fill="#fde68a" font-size="17">API · workers · timers</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M310 220h160"/><path d="M720 220h160"/>
  </g>
  <g fill="#cbd5e1"><path d="m455 210 20 10-20 10z"/><path d="m865 210 20 10-20 10z"/></g>
</svg>
