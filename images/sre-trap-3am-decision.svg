<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Three AM alert decision flow</title>
<desc id="desc">A flowchart asks whether someone needs to act, routing yes to page and no to dashboard or log.</desc>
<rect width="1600" height="900" fill="#0d1b2a"/><g font-family="Arial, sans-serif" text-anchor="middle" font-size="34" font-weight="bold"><rect x="530" y="80" width="540" height="130" rx="18" fill="#e2ad58"/><text x="800" y="160" fill="#0d1b2a">ALERT FIRES AT 3 AM</text><path d="M800 210 V330" stroke="#54d6c7" stroke-width="8"/><polygon points="800,350 770,315 830,315" fill="#54d6c7"/><rect x="500" y="350" width="600" height="150" rx="18" fill="#54d6c7"/><text x="800" y="415" fill="#0d1b2a">DOES SOMEONE</text><text x="800" y="460" fill="#0d1b2a">NEED TO ACT?</text><path d="M500 425 H270 V620" stroke="#e05252" stroke-width="8" fill="none"/><path d="M1100 425 H1330 V620" stroke="#8a9aa7" stroke-width="8" fill="none"/><rect x="90" y="620" width="360" height="120" rx="18" fill="#e05252"/><text x="270" y="695" fill="#fff">YES: PAGE</text><rect x="1150" y="620" width="360" height="120" rx="18" fill="#718392"/><text x="1330" y="680" fill="#fff">NO: DASHBOARD</text><text x="1330" y="720" fill="#fff">OR LOG</text><text x="465" y="405" fill="#e05252">YES</text><text x="1135" y="405" fill="#c4d2d9">NO</text></g>
</svg>
