<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Expected HTTP errors versus abnormal spike</title>
<desc id="desc">A chart shows 400 and 404 responses near a baseline, followed by a sharp abnormal 4xx spike.</desc>
<rect width="1600" height="900" fill="#0d1b2a"/><g stroke="#29465a" stroke-width="3"><line x1="180" y1="730" x2="1450" y2="730"/><line x1="180" y1="180" x2="180" y2="730"/><line x1="180" y1="420" x2="1450" y2="420" stroke-dasharray="12 12"/></g>
<path d="M180 570 L330 545 L480 565 L630 550 L780 560 L930 545 L1080 560 L1180 550 L1240 510 L1300 360 L1360 220 L1450 190" fill="none" stroke="#e05252" stroke-width="10"/>
<line x1="180" y1="420" x2="1450" y2="420" stroke="#54d6c7" stroke-width="5" stroke-dasharray="16 12"/>
<g font-family="Arial, sans-serif" fill="#e8f0f2" font-size="34"><text x="210" y="125">4xx response rate</text><text x="1040" y="385" fill="#54d6c7">normal baseline</text><text x="1230" y="165" fill="#e05252">abnormal spike</text><text x="700" y="805">time</text></g>
</svg>
