<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Noise versus signal</title>
<desc id="desc">A split diagram compares a chaotic wall of 50 alerts with three highlighted actionable alerts.</desc>
<rect width="1600" height="900" fill="#0d1b2a"/><line x1="800" y1="80" x2="800" y2="820" stroke="#54d6c7" stroke-width="4"/>
<g font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#e8f0f2"><text x="180" y="130">NOISE</text><text x="1040" y="130">SIGNAL</text></g>
<g fill="#e05252"><circle cx="180" cy="240" r="22"/><circle cx="290" cy="240" r="22"/><circle cx="400" cy="240" r="22"/><circle cx="510" cy="240" r="22"/><circle cx="620" cy="240" r="22"/><circle cx="235" cy="350" r="22"/><circle cx="345" cy="350" r="22"/><circle cx="455" cy="350" r="22"/><circle cx="565" cy="350" r="22"/><circle cx="675" cy="350" r="22"/><circle cx="180" cy="460" r="22"/><circle cx="290" cy="460" r="22"/><circle cx="400" cy="460" r="22"/><circle cx="510" cy="460" r="22"/><circle cx="620" cy="460" r="22"/></g>
<g fill="#8a9aa7"><circle cx="940" cy="240" r="22"/><circle cx="1050" cy="240" r="22"/><circle cx="1160" cy="240" r="22"/><circle cx="1270" cy="240" r="22"/><circle cx="1380" cy="240" r="22"/><circle cx="995" cy="350" r="22"/><circle cx="1105" cy="350" r="22"/><circle cx="1215" cy="350" r="22"/><circle cx="1325" cy="350" r="22"/><circle cx="1380" cy="460" r="22"/></g>
<g fill="#e05252" stroke="#fff" stroke-width="6"><circle cx="940" cy="460" r="30"/><circle cx="1160" cy="460" r="30"/><circle cx="1380" cy="460" r="30"/></g>
<g font-family="Arial, sans-serif" font-size="30" fill="#c4d2d9"><text x="230" y="700">50 alerts</text><text x="1050" y="700">3 actionable signals</text></g>
</svg>
